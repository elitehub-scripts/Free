name: Build Debug APK & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "::error::JAVA_HOME is not set after Java setup."
            exit 1
          fi
          JAVA_VER_LINE="$(java -version 2>&1 | head -n 1 || true)"
          RAW_VER="$(printf '%s\n' "$JAVA_VER_LINE" | sed -n 's/.*"\([0-9][0-9._]*\)".*/\1/p')"
          if [ -z "$RAW_VER" ]; then
            echo "::error::Could not detect Java version from output: ${JAVA_VER_LINE}"
            exit 1
          fi
          MAJOR_VER="${RAW_VER%%.*}"
          if [ "$MAJOR_VER" = "1" ]; then
            REST="${RAW_VER#1.}"
            MAJOR_VER="${REST%%.*}"
          fi
          if ! [[ "$MAJOR_VER" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse Java major version from '${RAW_VER}'."
            exit 1
          fi
          echo "Detected Java major version: ${MAJOR_VER}"
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java ${MAJOR_VER}."
            exit 1
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          if [ -f "./debug.keystore" ]; then
            echo "Temporary ./debug.keystore already exists; skipping generation."
          else
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [ ! -x "$KEYTOOL_BIN" ]; then
              echo "::error::keytool not found in configured Java 17 installation (${JAVA_HOME})."
              exit 1
            fi
            echo "Creating temporary ./debug.keystore using Java 17 keytool..."
            "$KEYTOOL_BIN" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt
          fi
          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "::error::Temporary ./debug.keystore could not be verified."
            exit 1
          fi
          echo "Temporary ./debug.keystore is ready."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$APK_PATH" ]; then
            echo "::error::Expected debug APK does not exist at ${APK_PATH}."
            if [ -d "app/build/outputs/apk" ]; then
              echo "APK files discovered inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::${APK_PATH} is not a regular file."
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::${APK_PATH} is empty."
            exit 1
          fi
          case "$APK_PATH" in
            *.apk) ;;
            *)
              echo "::error::${APK_PATH} does not have the .apk extension."
              exit 1
              ;;
          esac
          if [ "$APK_PATH" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::APK path mismatch: ${APK_PATH}"
            exit 1
          fi
          echo "Verified debug APK: ${APK_PATH} ($(wc -c < "$APK_PATH") bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ]; then
            echo "::error::Verified debug APK is missing at ${SOURCE_APK}."
            exit 1
          fi
          RAW_REPO="${GITHUB_REPOSITORY##*/}"
          SAFE_REPO="$(printf '%s' "$RAW_REPO" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^[.-]+//; s/[.-]+$//')"
          if [ -z "$SAFE_REPO" ]; then
            SAFE_REPO="android-app"
          fi
          RELEASE_ASSET_NAME="${SAFE_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TEMP_DIR="$(mktemp -d "${RUNNER_TEMP}/release-asset-XXXXXX")"
          RELEASE_ASSET_PATH="${TEMP_DIR}/${RELEASE_ASSET_NAME}"
          cp "$SOURCE_APK" "$RELEASE_ASSET_PATH"
          if [ ! -f "$RELEASE_ASSET_PATH" ] || [ ! -s "$RELEASE_ASSET_PATH" ]; then
            echo "::error::Prepared release asset could not be verified at ${RELEASE_ASSET_PATH}."
            exit 1
          fi
          {
            echo "asset_path=${RELEASE_ASSET_PATH}"
            echo "asset_name=${RELEASE_ASSET_NAME}"
          } >> "$GITHUB_OUTPUT"
          echo "Prepared release asset filename: ${RELEASE_ASSET_NAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::GitHub CLI (gh) is not available on this runner."
            exit 1
          fi
          gh --version

          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Prepared release APK asset is missing or empty."
            exit 1
          fi
          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "::error::Prepared release asset does not have the .apk extension: ${ASSET_PATH}"
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES=$(cat <<EOF
          - This is an automatically generated debug APK.
          - Built by GitHub Actions.
          - GitHub Actions run number: ${GITHUB_RUN_NUMBER}
          - GitHub Actions run attempt: ${GITHUB_RUN_ATTEMPT}
          - Source commit SHA: ${GITHUB_SHA}
          - This APK is intended for testing only.
          - This APK is not a Play Store production release.
          - This APK is signed only with a temporary debug keystore.
          EOF
          )

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Report APK download result
        if: ${{ always() && steps.upload_artifact.outcome == 'success' && steps.prepare_asset.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            gh release view "$RELEASE_TAG"
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
            RELEASE_TITLE="$(gh release view "$RELEASE_TAG" --json name --jq '.name')"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_NAME}"
            {
              echo "### Debug APK Build & GitHub Release Published"
              echo ""
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Page URL:** ${RELEASE_URL}"
              echo "- **APK Asset Filename:** \`${ASSET_NAME}\`"
              echo ""
              echo "You can download the APK directly from the **Assets** section on the GitHub Release page above."
              echo "The normal GitHub Actions artifact (\`app-debug-apk\`) is also available as a backup on this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed, but the debug APK build and GitHub Actions artifact upload succeeded. Download the backup artifact 'app-debug-apk' from this workflow run."
            {
              echo "### Warning: GitHub Release Publishing Failed"
              echo ""
              echo "- **APK Build Status:** Succeeded (\`app/build/outputs/apk/debug/app-debug.apk\`)"
              echo "- **Backup Actions Artifact:** \`app-debug-apk\` remains available for download from this workflow run."
              echo "- **Release Publishing:** Failed; check the \`Publish APK to GitHub Releases\` step logs for details."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
